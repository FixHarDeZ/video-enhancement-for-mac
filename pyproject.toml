[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "video-enhancer-mac"
version = "1.0.0"
description = "Video enhancement app for Apple Silicon Macs"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2",
    "Pillow>=10.0.0",
]

[project.scripts]
video-enhancer = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
